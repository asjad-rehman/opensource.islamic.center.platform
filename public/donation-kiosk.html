<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Donation Kiosk</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; background:#000; overflow:hidden; }
    body { position:fixed; inset:0; }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  </style>
</head>
<body>
  <video id="kioskVideo" autoplay muted loop playsinline preload="none" poster="/ich.jpeg" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video>
  <script>
    (async () => {
      const video = document.getElementById('kioskVideo');
      // Loop a complete local Blob, never the network URL. CacheStorage keeps
      // the file across page reloads; HTTP caching covers unsupported browsers.
      const mediaUrl = '/gemini_generated_video_77009492.mp4';
      let cache;
      let response;
      try {
        cache = await caches.open('ich-kiosk-media-v1');
        response = await cache.match(mediaUrl);
      } catch { /* Storage can be unavailable in restricted kiosk browsers. */ }
      try {
        if (!response) {
          response = await fetch(mediaUrl, { cache: 'force-cache' });
          if (!response.ok || response.status === 206) throw new Error('Incomplete kiosk video');
          if (cache) {
            try { await cache.put(mediaUrl, response.clone()); } catch { /* Play the memory copy. */ }
          }
        }
        const blob = await response.blob();
        if (!blob.size || !blob.type.startsWith('video/')) throw new Error('Invalid kiosk video');
        video.src = URL.createObjectURL(blob);
      } catch (error) {
        // No streaming fallback or retry loop: a failure must not drain bandwidth.
        console.warn('Kiosk video unavailable', error);
        return;
      }
      video.muted = true;
      video.loop = true;
      const play = () => video.play().catch(() => {});
      video.addEventListener('ended', () => { video.currentTime = 0; play(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) play(); else video.pause(); });
      window.addEventListener('focus', play);
      window.addEventListener('pageshow', play);
      play();
    })();
  </script>
</body>
</html>
